<script>
document.addEventListener("DOMContentLoaded", function () {

  /* =====================================================
     TIME MACHINE — AUDIO SYSTEM
  ===================================================== */

  const audio = {
    radio: new Audio("./radio.mp3"),
    nature: new Audio("./nature-morning.mp3"),
    rain: new Audio("./rain.mp3"),

    vayalum: new Audio("./vayalum-veedum.mp3"),
    youvavani: new Audio("./youvavani.mp3"),
    nadakam: new Audio("./radio-nadakam.mp3"),
    gana: new Audio("./gana-paripadi.mp3")
  };

  /* LOOP */
  audio.radio.loop = true;
  audio.nature.loop = true;
  audio.rain.loop = true;

  /* DEFAULT VOLUME */
  audio.radio.volume = 0.78;
  audio.nature.volume = 0.28;
  audio.rain.volume = 0.22;


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const bulb = document.getElementById("warmBulb");
  const enterBtn = document.getElementById("enterBtn");
  const machine = document.getElementById("machine");

  const rainBtn = document.getElementById("rainBtn");

  const radioBtn = document.getElementById("radioBtn");
  const natureSwitch = document.getElementById("natureSwitch");
  const rainSwitch = document.getElementById("rainSwitch");
  const headsetSwitch = document.getElementById("headsetSwitch");

  const radioVol = document.getElementById("radioVol");
  const natureVol = document.getElementById("natureVol");
  const rainVol = document.getElementById("rainVol");

  const radioVal = document.getElementById("radioVal");
  const natureVal = document.getElementById("natureVal");
  const rainVal = document.getElementById("rainVal");

  const programName = document.getElementById("programName");
  const timeSlot = document.getElementById("timeSlot");


  /* =====================================================
     BULB
  ===================================================== */

  function toggleLight() {

    document.body.classList.toggle("dark-mode");

    localStorage.setItem(
      "timeMachineDark",
      document.body.classList.contains("dark-mode")
        ? "on"
        : "off"
    );
  }

  if (
    localStorage.getItem("timeMachineDark") === "on"
  ) {
    document.body.classList.add("dark-mode");
  }

  if (bulb) {

    bulb.addEventListener("click", toggleLight);

    bulb.addEventListener("keydown", function (e) {

      if (e.key === "Enter" || e.key === " ") {

        e.preventDefault();
        toggleLight();

      }

    });
  }


  /* =====================================================
     ENTER
  ===================================================== */

  if (enterBtn && machine) {

    enterBtn.addEventListener("click", function () {

      machine.classList.remove("hidden");

      setTimeout(function () {

        machine.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 100);

    });
  }


  /* =====================================================
     VOLUME
  ===================================================== */

  function connectVolume(input, label, sound) {

    if (!input || !label) return;

    function update() {

      const value = Number(input.value);

      label.textContent = value + "%";

      sound.volume = value / 100;
    }

    input.addEventListener("input", update);

    update();
  }

  connectVolume(
    radioVol,
    radioVal,
    audio.radio
  );

  connectVolume(
    natureVol,
    natureVal,
    audio.nature
  );

  connectVolume(
    rainVol,
    rainVal,
    audio.rain
  );


  /* =====================================================
     SWITCH UI
  ===================================================== */

  function setSwitch(button, state) {

    if (!button) return;

    button.classList.toggle("on", state);

    const span = button.querySelector("span");

    if (span) {
      span.textContent = state ? "ON" : "OFF";
    }
  }

  function toggleSwitch(button) {

    if (!button) return false;

    const state =
      !button.classList.contains("on");

    setSwitch(button, state);

    return state;
  }


  /* =====================================================
     RADIO
  ===================================================== */

  if (radioBtn) {

    radioBtn.addEventListener("click", function () {

      const on = toggleSwitch(radioBtn);

      if (on) {

        audio.radio.play().catch(function (err) {
          console.log("Radio:", err);
        });

      } else {

        audio.radio.pause();

      }

    });
  }


  /* =====================================================
     NATURE
  ===================================================== */

  if (natureSwitch) {

    natureSwitch.addEventListener("click", function () {

      const on = toggleSwitch(natureSwitch);

      if (on) {

        audio.nature.play().catch(function (err) {
          console.log("Nature:", err);
        });

      } else {

        audio.nature.pause();

      }

    });
  }


  /* =====================================================
     RAIN
  ===================================================== */

  if (rainSwitch) {

    rainSwitch.addEventListener("click", function () {

      const on = toggleSwitch(rainSwitch);

      if (on) {

        audio.rain.play().catch(function (err) {
          console.log("Rain:", err);
        });

      } else {

        audio.rain.pause();

      }

    });
  }


  /* =====================================================
     TOP RAIN BUTTON
  ===================================================== */

  if (rainBtn) {

    rainBtn.addEventListener("click", function () {

      if (rainSwitch) {

        rainSwitch.click();

      }

    });
  }


  /* =====================================================
     STOP PROGRAM AUDIO
  ===================================================== */

  function stopProgramAudio() {

    audio.vayalum.pause();
    audio.youvavani.pause();
    audio.nadakam.pause();
    audio.gana.pause();

    audio.vayalum.currentTime = 0;
    audio.youvavani.currentTime = 0;
    audio.nadakam.currentTime = 0;
    audio.gana.currentTime = 0;
  }


  /* =====================================================
     PLAY PROGRAM
  ===================================================== */

  function playProgram(sound, name, time) {

    stopProgramAudio();

    if (programName) {
      programName.textContent = name;
    }

    if (timeSlot) {
      timeSlot.textContent = time;
    }

    sound.currentTime = 0;

    sound.play().then(function () {

      console.log(
        "▶ Playing:",
        name
      );

    }).catch(function (error) {

      console.error(
        "Audio error:",
        error
      );

      alert(
        "Audio play ചെയ്യാൻ കഴിഞ്ഞില്ല.\n\nMP3 file name പരിശോധിക്കുക."
      );

    });
  }


  /* =====================================================
     🌾 VAYALUM VEEDUM
  ===================================================== */

  const vayalumBtn =
    document.getElementById("vayalumVeedumBtn");

  if (vayalumBtn) {

    vayalumBtn.addEventListener(
      "click",
      function () {

        playProgram(
          audio.vayalum,
          "വയലും വീടും",
          "07:00 — 07:30"
        );

      }
    );
  }


  /* =====================================================
     🎙️ YOUVAVANI
  ===================================================== */

  const youvavaniBtn =
    document.getElementById("youvavaniBtn");

  if (youvavaniBtn) {

    youvavaniBtn.addEventListener(
      "click",
      function () {

        playProgram(
          audio.youvavani,
          "യുവവാണി",
          "08:00 — 08:30"
        );

      }
    );
  }


  /* =====================================================
     🎭 RADIO NADAKAM
  ===================================================== */

  const nadakamBtn =
    document.getElementById("radioNadakamBtn");

  if (nadakamBtn) {

    nadakamBtn.addEventListener(
      "click",
      function () {

        playProgram(
          audio.nadakam,
          "റേഡിയോ നാടകം",
          "20:00 — 21:00"
        );

      }
    );
  }


  /* =====================================================
     🎵 GANA PARIPADI
  ===================================================== */

  const ganaBtn =
    document.getElementById("ganaParipadiBtn");

  if (ganaBtn) {

    ganaBtn.addEventListener(
      "click",
      function () {

        playProgram(
          audio.gana,
          "ഗാനപരിപാടി",
          "18:00 — 19:00"
        );

      }
    );
  }


  /* =====================================================
     📰 NEWS
     No MP3 currently connected
  ===================================================== */

  const newsBtn =
    document.getElementById("newsBtn");

  if (newsBtn) {

    newsBtn.addEventListener(
      "click",
      function () {

        if (programName) {
          programName.textContent =
            "വാർത്ത";
        }

        if (timeSlot) {
          timeSlot.textContent =
            "അന്നത്തെ വാർത്തകൾ";
        }

      }
    );
  }


  /* =====================================================
     📢 ADS
  ===================================================== */

  const adsBtn =
    document.getElementById("adsBtn");

  if (adsBtn) {

    adsBtn.addEventListener(
      "click",
      function () {

        if (programName) {
          programName.textContent =
            "പരസ്യങ്ങൾ";
        }

        if (timeSlot) {
          timeSlot.textContent =
            "1980 — 1990";
        }

      }
    );
  }


  /* =====================================================
     DATE
  ===================================================== */

  const dateLabel =
    document.getElementById("dateLabel");

  if (dateLabel) {

    const years = [
      "1982 · ഒരു രാവിലെ",
      "1984 · ഒരു വൈകുന്നേരം",
      "1985 · ഒരു രാവിലെ",
      "1987 · ഒരു രാത്രി",
      "1989 · ഒരു ഞായറാഴ്ച"
    ];

    let index = 2;

    dateLabel.addEventListener(
      "click",
      function () {

        index++;

        if (index >= years.length) {
          index = 0;
        }

        dateLabel.textContent =
          years[index];

      }
    );
  }


  /* =====================================================
     INITIAL BUTTON STATE
  ===================================================== */

  setSwitch(radioBtn, true);
  setSwitch(natureSwitch, true);
  setSwitch(rainSwitch, false);
  setSwitch(headsetSwitch, true);


  console.log(
    "TIME MACHINE — AUDIO READY"
  );

});
</script>
